# Team benchmark clips: the advisor's 8 labelled clips (see README.md for provenance).
#
# frames / duration_s are DECODED counts: what cv2 (and ffmpeg) actually return when the
# file is read to the end, and duration_s = frames / fps, which is how the monitor times
# file frames. container_frames is CAP_PROP_FRAME_COUNT, which over-reports on every clip
# (team-occupancy OCC-17); the team's ground truth used container_frames / fps as its
# 'duration', kept there as 'container_duration'.
# size_bytes / sha256 identify the exact files tools/fetch_clips.py must download.

source:
  zones_and_ground_truth: upstream/sergei-crossing-experiments @ 2f90d19, occupancy_monitor/ (S. Chuprov)
  drive_ids: upstream/dataset-pipeline @ ca5ca4e, data/manifests/videos.yaml (D. Sanchez)
